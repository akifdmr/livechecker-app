<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4CAF50">
        <animate attributeName="stop-color" values="#4CAF50;#8BC34A;#4CAF50" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2E7D32">
        <animate attributeName="stop-color" values="#2E7D32;#4CAF50;#2E7D32" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="26" fill="#4CAF50" opacity="0.2">
    <animate attributeName="r" values="26;30;26" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.05;0.25" dur="2s" repeatCount="indefinite"/>
  </circle>

  <rect x="8" y="16" width="48" height="32" rx="6" fill="url(#cardGrad)"/>
  <rect x="8" y="23" width="48" height="5" fill="#0d1017" opacity="0.85"/>
  <rect x="14" y="34" width="9" height="7" rx="1.5" fill="#FFD54F">
    <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <path d="M30 40 L36 46 L50 32" stroke="#0d1017" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="30" stroke-dashoffset="30">
    <animate attributeName="stroke-dashoffset" values="30;0;30" dur="3s" repeatCount="indefinite" keyTimes="0;0.5;1"/>
  </path>
</svg>